    <script>
      var UA = window.navigator.userAgent.toLowerCase();
      var isWeiXin = UA && UA.indexOf('micromessenger') > -1;
      var onVisibilityChanged = function () {
        if (!isWeiXin) {
          //console.log("不是来自微信内置浏览器");
          var visitState = document.visibilityState;
          var needReloadWhenShow = localStorage.getItem('need_reload_when_show');
          if ((!visitState || visitState == 'visible') && needReloadWhenShow == 1) {
            localStorage.setItem('need_reload_when_show', '0');
            var href = location.pathname;
            if (href) {
              location.replace(href + '?' + new Date().getTime());
            } else {
              location.reload(true);
            }
          }
        }
      };
      // 用户退到后台或从后台返回触发
      document.addEventListener('webkitvisibilitychange', onVisibilityChanged, false);
      document.addEventListener('visibilitychange', onVisibilityChanged, false);
    </script>

    <script>
        var htmlDom = document.documentElement;
        var windowWidth = htmlDom.clientWidth;

        var proportion = 7.5;
        if (windowWidth >= 480) {
            windowWidth = 480;
        }

        var evt = 'onorientationchange' in window ? 'orientationchange' : 'resize';
        htmlDom.style.fontSize = windowWidth / proportion + 'px';
        (function () {
            document.addEventListener(
                    'DOMContentLoaded',
                    function () {
                    if (!htmlDom.style.fontSize) {
                        var htmlDomProtect = document.documentElement;
                        var windowWidth = htmlDomProtect.clientWidth;
                        if (windowWidth >= 480) {
                        windowWidth = 480;
                        }
                        htmlDomProtect.style.fontSize = windowWidth / proportion + 'px';
                    }
                    },
                    false
            );
        })();

        window.addEventListener(

                var windowWidth = htmlDomProtect.clientWidth;
                if (windowWidth >= 480) {
                    windowWidth = 480;

                htmlDomProtect.style.fontSize = windowWidth / proportion + 'px';

            },

        <script>
                    function getQueryString(name) {
                        let query_string =  window.location.search;
                        if (!query_string) return null; // 如果无参，返回null
                        let re = /[?&]?([^=]+)=([^&]*)/g;
                        let tokens;
                        while (tokens = re.exec(query_string)) {
                        if (decodeURIComponent(tokens[1]) === name) {
                            return decodeURIComponent(tokens[2]);
                        }
                        }
                        return null;
                    }
                    if (window.location.search.indexOf("show_resource_alert") > -1) {
                        if (!window.performance && !window.performance.getEntriesByType) {
                            alert("浏览器不支持performance API")
                        } else {
                            const timeoutValue = getQueryString("show_resource_alert")
                            const timeoutFetch = new Set()
                            // 资源加载超时监听。定期获取资源条目（每秒钟），60秒清除
                            const timer = setInterval(function() {
                            let entries = performance.getEntriesByType("resource");
                            entries.forEach(function(entry) {
                                if(entry.initiatorType === "link" || entry.initiatorType === "script" )
                                if(entry.duration > + timeoutValue){
                                    if(!timeoutFetch.has(entry.name)){
                                    alert("资源URL："+ entry.name+"加载耗时："+ entry.duration + "ms"+"资源类型："+ entry.initiatorType)
                                    timeoutFetch.add(entry.name)
                                    }
                                }
                            });
                            }, 1000);
                            setTimeout(()=>{
                            clearInterval(timer)
                            },60000)
                        }
                        // 资源加载错误监听
                        window.addEventListener("error", function (e) {
                            const tag = e.target.localName;
                            if (tag === "link" || tag === "script") {
                            // 错误处理
                            alert(JSON.stringify(e.target.src || e.target.href || e.target.localName) +"-----资源加载错误----")
                            }
                        }, true);
                    }
                    if (window.location.search.indexOf("show_choke_alert") > -1) {
                        const time = getQueryString("show_choke_alert")
                        const type = getQueryString("show_choke_alert_type") || "script"
                        function checkJSIntercept(){
                            if (document.readyState === "complete") {
                                alert("未阻塞页面加载" + " document.readyState："+document.readyState);
                            } else {
                                if (!window.performance && !window.performance.getEntriesByType) {
                                    alert("浏览器不支持performance API")
                                } else {
                                    let resources = performance.getEntriesByType("resource");
                                    let result = []
                                    for (var i = 0; i < resources.length; i++) {
                                        var resource = resources[i];
                                        if (resource.initiatorType === type && resource.duration !== 0) {
                                            const arr = resource.name.split("/")
                                            result.push(arr[arr.length-1]);
                                        }
                                    }
                                    alert("阻塞加载的资源：" + JSON.stringify(result) + " document.readyState："+document.readyState);
                                }
                            }
                        }
                        setTimeout(function() {
                            checkJSIntercept()
                        }, +time);
                    }
                </script>

<script type="text/javascript">
    if (true){
        //默认就是隐藏
        var menu = document.getElementById("navigation_menu");
        if(menu)menu.parentNode.removeChild(menu);
    } else {
        //显示出来
        var menu = document.getElementById("navigation_menu");
        if(menu)menu.style.display = "block";
    }

    var menu_init = function () {
        var bd = document.querySelector('body');
        var forbid = document.getElementById('forbidPageIndex');
        var navigation_menu = document.querySelector('#navigation_menu');
        //账号被封不存在navigation_menu直接返回
        if(!navigation_menu)return;
        //黑名单页隐藏
        if(forbid){
            navigation_menu.style.display = 'none';
        }
        // 事件委托
        bd.addEventListener('touchend', function(e){
            e = e || window.event;
            if (!navigation_menu) {
                return;
            }
            var target = e.target || e.srcElement;
            var nodeName = target.nodeName.toLocaleLowerCase();
            // 输入表单时隐藏回到首页，防止ios输入法弹框造成回到首页图标fixed定位错乱
            if (nodeName == 'input' || nodeName == 'textarea') {
                target.addEventListener('focus', function() {
                    navigation_menu.style.display = 'none'; // 隐藏回到首页
                });
                target.addEventListener('blur', function() {
                    navigation_menu.style.display = 'block'; // 隐藏回到首页
                    if(forbid){
                        navigation_menu.style.display = 'none';
                    }
                });
            }
        });
        return;
    }
    window.onload = menu_init;
</script>
