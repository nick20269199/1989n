# 高危阻断模式列表 v2 — 全量覆盖
# 生成: 2026-05-28
# 基于: ops-standards.md 操作门禁规范
#
# 匹配到以下任一模式且未匹配到对应 Agent 时 → status: blocked
# 已有对应 Agent 匹配 → 不阻断（由 Agent 负责安全执行）

blocked_patterns:
  # ──── 文件系统操作 ────
  - "删除.*文件|rm\\s+-rf|del\\s+/[fs]|rmdir|rd\\s+/[fs]"

  # ──── 数据库 DDL/DML ────
  - "DROP\\s+TABLE|DELETE\\s+FROM|ALTER\\s+TABLE|TRUNCATE\\s+TABLE|DROP\\s+DATABASE"

  # ──── 交易执行 ────
  - "执行.*交易|下单|买入|卖出.*股票|市价.*委托|限价.*委托"

  # ──── 飞书消息推送（禁止主模型直发） ────
  - "发送.*飞书.*消息|发.*飞书|推送.*飞书|飞书.*发送"

  # ──── 配置修改（必须经过备份） ────
  - "修改.*配置|编辑.*config|更改.*设置|修改.*env"

  # ──── 服务重启 ────
  - "重启.*服务|停止.*服务|关闭.*服务|kill\\s+[0-9]+|taskkill"

  # ──── 密钥/凭证操作 ────
  - "轮换.*密钥|重置.*密码|修改.*密码|重新生成.*token|重新生成.*key"

  # ──── 批量/强制操作 ────
  - "chmod\\s+777|chmod\\s+-R|rm\\s+-rf\\s+/|format|磁盘格式化"

  # ──── 权限/用户管理 ────
  - "删除.*用户|删除.*角色|授予.*权限|REVOKE|GRANT\\s+ALL"

  # ──── 高危 Git 操作 ────
  - "git\\s+push\\s+--force|git\\s+reset\\s+--hard|git\\s+checkout\\s+--\\."
