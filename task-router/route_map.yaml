# 强制任务路由表 v2 — 全量覆盖
# 生成: 2026-05-28
# 基于: 52 agents + 89 skills 全量扫描 + ops-standards.md 部门映射
#
# 部门缩写: front-office(前厅) / intelligence(情报) / engineering(工程) / rd(研发) / reader(读书郎) / hub(枢部)
