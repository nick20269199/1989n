# ============================================================================
# 正则路由（补充关键词匹配不到的场景）
# ============================================================================
regex_routes:
  # 错误日志
  - pattern: ".*(错误|异常|失败|报错).*(日志|log|traceback).*"
    agent: "errorlog"
    skill: "errorlog"

  # GAN 评估
  - pattern: ".*(评估|检查|诊断|审计).*(agent|Agent|技能|skill|系统).*"
    agent: "gan-evaluator"
    skill: "skill-stocktake"

  # 交易审查
  - pattern: ".*(开仓|买入|卖入|加仓).*(股票|代码|symbol|代码).*"
    agent: "adversarial-review"
    skill: "adversarial-review"

  # 代码/语法门禁
  - pattern: ".*(语法|门禁|gate|import|检查).*(代码|文件|脚本).*"
    agent: "build-error-resolver"
    skill: "code-review"

  # 上下文管理
  - pattern: ".*(对话|会话).*(太长|压缩|清理|clear|超过).*"
    agent: "ctx-health"
    skill: "ctx-health"

  # 部署规划
  - pattern: ".*(部署|上线|发布|release).*(脚本|配置|服务).*"
    agent: "planner"
    skill: "blueprint"

  # 备份/迁移
  - pattern: ".*(备份|迁移|搬家).*(数据|配置|文件).*"
    agent: "code-explorer"
    skill: "explore"

  # 注释/文档维护
  - pattern: ".*(注释|文档).*(过时|不准确|更新|修复).*"
    agent: "comment-analyzer"
    skill: "code-review"

  # Agent 故障
  - pattern: ".*(Agent|agent|技能|skill|系统).*(不工作|故障|挂了|坏了|异常|无法运行).*"
    agent: "gan-evaluator"
    skill: "gan-evaluator"

  # 无障碍/可访问性
  - pattern: ".*(无障碍|辅助功能|屏幕阅读器|键盘导航).*"
    agent: "a11y-architect"
    skill: "code-review"

  # 开源发布流程
  - pattern: ".*(开源).*(发布|分叉|fork|清理|安全|验证).*"
    agent: "opensource-forker"
    skill: "skill-stocktake"

  # 协调/分诊
  - pattern: ".*(不确定|不知道|不清楚).*(该谁|路由|部门|分配|协调).*"
    agent: "coordinator-agent"
    skill: "cross-dept-flow"

