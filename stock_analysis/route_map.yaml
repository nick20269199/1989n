    skill: "java-review"
    dept: "engineering"
  - keywords: ["C++审查", "C++代码", "Cpp.*审查"]
    agent: "cpp-reviewer"
    skill: "cpp-review"
    dept: "engineering"
  - keywords: ["C#审查", ".NET审查", "CSharp.*审查"]
