# ──────────── 正则路由（补充关键词匹配不到的场景） ────────────
regex_routes:
  - pattern: ".*(错误|异常|失败|报错).*(日志|log|traceback).*"
    agent: "errorlog"
    skill: "errorlog"
  - pattern: ".*(评估|检查|诊断|审计).*(agent|Agent|技能|skill|系统).*"
    agent: "gan-evaluator"
    skill: "skill-stocktake"
  - pattern: ".*(开仓|买入|卖入|加仓).*(股票|代码|symbol|代码).*"
    agent: "adversarial-review"
    skill: "adversarial-review"
  - pattern: ".*(语法|门禁|gate|import|检查).*(代码|文件|脚本).*"
    agent: "build-error-resolver"
    skill: "code-review"
  - pattern: ".*(对话|会话).*(太长|压缩|清理|clear|超过).*"
    agent: "ctx-health"
    skill: "ctx-health"
  - pattern: ".*(部署|上线|发布|release).*(脚本|配置|服务).*"
    agent: "planner"
    skill: "blueprint"
  - pattern: ".*(备份|迁移|搬家).*(数据|配置|文件).*"
    agent: "code-explorer"
    skill: "explore"
  - pattern: ".*(注释|文档).*(过时|不准确|更新|修复).*"
    agent: "comment-analyzer"
    skill: "code-review"
  - pattern: ".*(Agent|agent|技能|skill|系统).*(不工作|故障|挂了|坏了|异常|无法运行).*"
    agent: "gan-evaluator"
    skill: "gan-evaluator"

# ──────────── 兜底路由 ────────────
fallback:
  agent: "dept-engineering"
  skill: "dept-engineering"
  action: "调用 dept-engineering 协调，识别任务归属部门后路由到对应 Agent"
