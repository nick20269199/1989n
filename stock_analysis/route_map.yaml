# 强制任务路由表 v1
# 生成: 2026-05-28
# 基于: 52 agents + 153 skills 全量扫描 + ops-standards.md 部门映射
#
# 使用方式: 接到任务 → 匹配 keywords/patterns → 路由到对应 Agent + Skill
# 匹配不到 → 走最后兜底: 调用 dept-engineering 协调

routes:
  # ──────────── 交易决策类 ────────────
  - keywords: ["股票分析", "选股", "量化回测", "回测结果", "回测报告", "量化", "行情", "K线", "技术面", "持仓", "盈亏", "当前持仓", "走势", "操作建议"]
    agent: "stock-analysis"
    skill: "stock-analysis"
    dept: "front-office"
  - keywords: ["深度分析", "基本面", "开仓", "调仓", "加仓", "建仓"]
    agent: "stock-deep"
    skill: "stock-deep"
    dept: "front-office"
  - keywords: ["快速行情", "盘中", "闪电", "快查"]
    agent: "stock-quick"
    skill: "stock-quick"
    dept: "front-office"
  - keywords: ["止损", "风控", "风险评估", "安全审查", "-7%"]
    agent: "adversarial-review"
    skill: "adversarial-review"
    dept: "front-office"

  # ──────────── 代码审查/质量（语言专用在前） ────────────
