blocked_patterns:
  # 数据操作 — 严禁直接删除
  - "删除.*文件|rm\\s+-rf"
  # 数据库 — 严禁直接执行 DDL/DML
  - "DROP\\s+TABLE|DELETE\\s+FROM|ALTER\\s+TABLE"
  # 交易 — 必须经过 adversarial-review
  - "执行.*交易|下单|买入|卖出.*股票"
  # 消息推送 — 必须经过飞书路由
  - "发送.*飞书.*消息|发.*飞书|推送.*飞书"
  # 配置 — 必须经过备份+门禁
  - "修改.*配置|编辑.*config"
  # 服务 — 必须经过预检
  - "重启.*服务|停止.*服务"
